<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="agSphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e8f0fe"/>
      <stop offset="70%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </radialGradient>
    
    <linearGradient id="agBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#1967d2"/>
    </linearGradient>

    <linearGradient id="agRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335"/>
      <stop offset="100%" stop-color="#c5221f"/>
    </linearGradient>

    <linearGradient id="agYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbc04"/>
      <stop offset="100%" stop-color="#f29900"/>
    </linearGradient>

    <linearGradient id="agGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>

    <filter id="agGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Backlight -->
  <circle cx="100" cy="100" r="68" fill="#4285f4" opacity="0.18" filter="url(#agGlow)"/>

  <!-- Orbital Ring 1: Back Half (Green & Yellow) -->
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agGreen)" stroke-width="7" stroke-dasharray="160 160" transform="rotate(-30 100 100)" opacity="0.75"/>
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agYellow)" stroke-width="7" stroke-dasharray="0 160 160 0" transform="rotate(-30 100 100)" opacity="0.75"/>

  <!-- Orbital Ring 2: Back Half (Red & Blue) -->
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agRed)" stroke-width="7" stroke-dasharray="160 160" transform="rotate(45 100 100)" opacity="0.75"/>
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agBlue)" stroke-width="7" stroke-dasharray="0 160 160 0" transform="rotate(45 100 100)" opacity="0.75"/>

  <!-- Levitating Central Core Sphere -->
  <circle cx="100" cy="98" r="44" fill="url(#agSphere)"/>
  <circle cx="86" cy="82" r="14" fill="#ffffff" opacity="0.75" filter="url(#agGlow)"/>

  <!-- Inverted Gravity Levitation Glyph / Upward Diamond -->
  <path d="M100 68 L112 88 L105 88 L105 106 L95 106 L95 88 L88 88 Z" fill="#ffffff" opacity="0.95" filter="url(#agGlow)"/>

  <!-- Orbital Ring 1: Front Half (3D Depth Over Sphere) -->
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agGreen)" stroke-width="8" stroke-dasharray="130 190" stroke-dashoffset="140" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agYellow)" stroke-width="8" stroke-dasharray="130 190" stroke-dashoffset="270" transform="rotate(-30 100 100)"/>

  <!-- Orbital Ring 2: Front Half (3D Depth Over Sphere) -->
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agRed)" stroke-width="8" stroke-dasharray="130 190" stroke-dashoffset="140" transform="rotate(45 100 100)"/>
  <ellipse cx="100" cy="100" rx="84" ry="38" stroke="url(#agBlue)" stroke-width="8" stroke-dasharray="130 190" stroke-dashoffset="270" transform="rotate(45 100 100)"/>

  <!-- Floating Particles / Quantum Dots -->
  <circle cx="32" cy="64" r="4" fill="#4285f4" filter="url(#agGlow)"/>
  <circle cx="168" cy="60" r="4.5" fill="#ea4335" filter="url(#agGlow)"/>
  <circle cx="174" cy="140" r="4" fill="#fbbc04" filter="url(#agGlow)"/>
  <circle cx="26" cy="136" r="4.5" fill="#34a853" filter="url(#agGlow)"/>
</svg>
